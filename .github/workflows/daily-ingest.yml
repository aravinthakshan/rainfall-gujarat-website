name: Daily data ingest

# Downloads the SEOC rainfall PDF and WRD reservoir PDF, parses them and
# upserts into MongoDB. Re-processes the last 3 days each run so late uploads
# are picked up; writes are idempotent (replace-by-date).
#
# Setup: repo Settings -> Secrets and variables -> Actions -> MONGODB_URI

on:
  schedule:
    # 04:30, 10:30 and 16:30 UTC = 10:00, 16:00 and 22:00 IST
    - cron: "30 4,10,16 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the last 3 days."
        required: false
      end:
        description: "Backfill end date (YYYY-MM-DD). Defaults to today."
        required: false
      kind:
        description: "What to ingest"
        type: choice
        options: [both, rainfall, reservoir]
        default: both

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Ingest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          KIND: ${{ inputs.kind || 'both' }}
        run: |
          args="--kind $KIND --fill-gaps"
          if [ -n "$START" ]; then args="$args --start $START"; fi
          if [ -n "$END" ]; then args="$args --end $END"; fi
          python python-scripts/ingest.py $args --workdir "$RUNNER_TEMP/pdfs"

      - name: Keep downloaded PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ github.run_id }}
          path: ${{ runner.temp }}/pdfs
          retention-days: 14
          if-no-files-found: ignore
